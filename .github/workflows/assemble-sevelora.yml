name: Sevelora - montagem e verificacao do Nuvi MIT
on:
  push:
    branches: ["integration/sevelora-nuvi-v1"]
    paths: [".github/workflows/assemble-sevelora.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sevelora-assembly
  cancel-in-progress: false

jobs:
  assemble-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "https://sexy-shop.duckdns.org"
      NEXT_PUBLIC_LAUNCH: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: integration/sevelora-nuvi-v1
      - name: Verificar que nao importamos conteudo proprietario
        run: |
          test -f overrides/apps/ecommerce-shop-demo/src/app/page.tsx
          test -f scripts/assemble-nuvi.sh
      - name: Descarregar codigo MIT pinado e aplicar Sevelora
        run: bash scripts/assemble-nuvi.sh
      - uses: pnpm/action-setup@v4
        with:
          version: "12.14.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Dependencias do projeto (runner efemero)
        run: pnpm install --frozen-lockfile
      - name: Build Next.js real
        run: pnpm --dir apps/ecommerce-shop-demo build
      - name: Smoke test HTTP das nove paginas e SEO de testes
        run: |
          pnpm --dir apps/ecommerce-shop-demo exec next start --port 3001 --hostname 127.0.0.1 > /tmp/sevelora-app.log 2>&1 &
          echo $! > /tmp/sevelora.pid
          trap 'kill "$(cat /tmp/sevelora.pid)" || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3001/ -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs
          mkdir -p qa
          cp /tmp/sevelora-app.log qa/server.log
          if command -v google-chrome >/dev/null; then
            google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1366,900 --screenshot=qa/home-desktop.png http://127.0.0.1:3001/ || true
            google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=qa/home-mobile.png http://127.0.0.1:3001/ || true
          fi
      - name: Guardar evidencias do build
        uses: actions/upload-artifact@v4
        with:
          name: sevelora-qa
          path: qa/
          if-no-files-found: warn
      - name: Guardar codigo fonte no repo (so apos testes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps packages package.json pnpm-workspace.yaml pnpm-lock.yaml LICENSE.upstream
          for file in turbo.json .npmrc .node-version .gitignore; do
            if [ -e "$file" ]; then git add -- "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "SEVELORA_ALREADY_ASSEMBLED"
          else
            git commit -m "feat: importar DemoShop Nuvi MIT e montar Sevelora"
            git push origin HEAD:integration/sevelora-nuvi-v1
          fi
