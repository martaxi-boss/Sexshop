name: Sevelora - verificacao da branch principal
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assemble-sevelora.yml"
      - "apps/**"
      - "overrides/**"
      - "scripts/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "next.config.*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sevelora-main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "https://sevelora.eu"
      NEXT_PUBLIC_LAUNCH: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: "12.14.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Validar catalogo e integracao editorial
        run: |
          node scripts/catalog-test.mjs
          node scripts/affiliate-navigation-smoke.mjs
      - name: Instalar dependencias isoladas do projeto
        run: pnpm install --frozen-lockfile
      - name: Compilar loja Next.js
        run: pnpm --dir apps/ecommerce-shop-demo build
      - name: Rastrear todas as paginas sem clicar em JavaScript
        run: node scripts/pagination-smoke.mjs
      - name: Ensaiar navegadores Chromium Firefox e WebKit com links Awin simulados
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/sevelora-qa" playwright@1.56.1 --ignore-scripts --no-audit --no-fund
          "$RUNNER_TEMP/sevelora-qa/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          node scripts/affiliate-browser-fixture.mjs "$RUNNER_TEMP/sevelora-catalog-qa.json"
          CATALOG_PATH="$RUNNER_TEMP/sevelora-catalog-qa.json" pnpm --dir apps/ecommerce-shop-demo exec next start --port 3003 --hostname 127.0.0.1 > "$RUNNER_TEMP/sevelora-browser.log" 2>&1 &
          browser_server=$!
          trap 'kill "$browser_server" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3003/catalogo -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3003/catalogo -o /dev/null
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/sevelora-qa/node_modules/playwright" SEVELORA_COMPAT_ORIGIN="http://127.0.0.1:3003" node scripts/affiliate-browser-qa.mjs
      - name: Guardar provas visuais entre navegadores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sevelora-browser-compat
          path: qa/*.png
          if-no-files-found: ignore
      - name: Verificar HTTP, canonico e indexabilidade
        run: |
          set -euo pipefail
          pnpm --dir apps/ecommerce-shop-demo exec next start --port 3001 --hostname 127.0.0.1 >/tmp/sevelora-next.log 2>&1 &
          child=$!
          trap 'kill "$child" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3001/ -o /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node scripts/smoke.mjs
