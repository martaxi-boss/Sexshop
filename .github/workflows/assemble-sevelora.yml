name: Sevelora - verificacao da branch principal
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assemble-sevelora.yml"
      - "apps/**"
      - "overrides/**"
      - "scripts/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "next.config.*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sevelora-main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "https://sevelora.eu"
      NEXT_PUBLIC_LAUNCH: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: "12.14.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Validar catalogo e integracao editorial
        run: node scripts/catalog-test.mjs
      - name: Instalar dependencias isoladas do projeto
        run: pnpm install --frozen-lockfile
      - name: Compilar loja Next.js
        run: pnpm --dir apps/ecommerce-shop-demo build
      - name: Rastrear todas as paginas sem clicar em JavaScript
        run: node scripts/pagination-smoke.mjs
      - name: Verificar HTTP, canonico e indexabilidade
        run: |
          set -euo pipefail
          pnpm --dir apps/ecommerce-shop-demo exec next start --port 3001 --hostname 127.0.0.1 >/tmp/sevelora-next.log 2>&1 &
          child=$!
          trap 'kill "$child" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3001/ -o /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node scripts/smoke.mjs
