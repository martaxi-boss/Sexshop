name: Sevelora - iOS Simulator native Safari and WKWebView test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sevelora-native-ios-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-apple-ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Apple iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-evidence
          xcodebuild -version | tee ios-evidence/xcode.txt
          xcrun simctl list devices available -j > ios-evidence/devices.json
          xcrun simctl list runtimes | tee ios-evidence/runtimes.txt
          python3 - <<'PY'
          import json,os
          d=json.load(open('ios-evidence/devices.json'))['devices']
          rows=[v for k,vs in d.items() if 'iOS' in k for v in vs if v.get('isAvailable') and 'iPhone' in v.get('name','')]
          if not rows:raise RuntimeError('No available Apple iOS Simulator on macOS runner')
          print("IOS_MODEL="+rows[0]['name'], "UUID="+rows[0]['udid'])
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('IOS_UUID='+rows[0]['udid']+'\n')
          PY
      - name: Boot genuine Apple iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl boot "$IOS_UUID" || true
          xcrun simctl bootstatus "$IOS_UUID" -b
      - name: Build iOS app using Apple simulator SDK
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SeveloraProbe.app"
          mkdir -p "$APP"
          cat > "$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>SeveloraProbe</string>
          <key>CFBundleIdentifier</key><string>com.sevelora.iosqa</string>
          <key>CFBundleName</key><string>Sevelora QA</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>LSRequiresIPhoneOS</key><true/>
          <key>MinimumOSVersion</key><string>17.0</string>
          </dict></plist>
          PLIST
          xcrun swiftc -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
             -target "$(uname -m)-apple-ios17.0-simulator" \
             -framework UIKit -framework WebKit -o "$APP/SeveloraProbe" \
             .github/qa/sevelora-native-ios-probe.swift
          codesign --force --sign - "$APP"
          xcrun simctl install "$IOS_UUID" "$APP"
      - name: Actual iOS WKWebView affiliate click on published site
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl launch "$IOS_UUID" com.sevelora.iosqa
          APPDATA="$(xcrun simctl get_app_container "$IOS_UUID" com.sevelora.iosqa data)"
          FILE="$APPDATA/Documents/result.json"
          FOUND=0
          for n in $(seq 1 55); do
            if test -s "$FILE"; then
              cp "$FILE" ios-evidence/native-webview-result.json
              if python3 -c 'import json,sys;j=json.load(open(sys.argv[1]));sys.exit(0 if j.get("status") in ("pass","failed") else 1)' ios-evidence/native-webview-result.json;then FOUND=1;break;fi
            fi
            sleep 1
          done
          xcrun simctl io "$IOS_UUID" screenshot ios-evidence/native-webview.png || true
          test "$FOUND" = 1 || { echo IOS_WEBVIEW_NO_TERMINAL_RESULT; cat ios-evidence/native-webview-result.json || true; exit 7; }
          cat ios-evidence/native-webview-result.json
          python3 - <<'PY'
          import json
          d=json.load(open('ios-evidence/native-webview-result.json'))
          assert d['status']=='pass', 'WKWebView did not reach Diversual'
          assert d['clicked'] and d['awin'] and d['merchant'] and d['merchantHTTP']==200 and not d['popup']
          print("NATIVE_APPLE_IOS_WEBVIEW_AWIN_DIVESUAL_PASS")
          PY
      - name: Open Apple Mobile Safari and inspect screenshot
        if: always()
        shell: bash
        run: |
          if test -n "$IOS_UUID"; then
            xcrun simctl terminate "$IOS_UUID" com.sevelora.iosqa || true
            xcrun simctl openurl "$IOS_UUID" 'https://sevelora.eu/produto/43428124436' || true
            sleep 9
            xcrun simctl io "$IOS_UUID" screenshot ios-evidence/mobile-safari-product.png || true
            xcrun simctl openurl "$IOS_UUID" 'https://www.awin1.com/pclick.php?p=43428124436&a=3157353&m=37722' || true
            sleep 12
            xcrun simctl io "$IOS_UUID" screenshot ios-evidence/mobile-safari-after-awin.png || true
            echo 'Mobile Safari navigation executed; screenshots need visual review.'
          fi
      - name: Keep real Apple iOS Simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sevelora-apple-ios-evidence
          path: ios-evidence/
          if-no-files-found: warn
          retention-days: 7
