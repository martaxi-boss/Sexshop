name: Sevelora - browser QA published staging
on:
  push:
    branches: ["integration/sevelora-nuvi-v1"]
    paths: [".github/workflows/staging-live-qa.yml"]
permissions:
  contents: read
jobs:
  live-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Install browser test driver only on ephemeral runner
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/qa" --no-audit --no-fund --ignore-scripts puppeteer-core@24.25.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          test -x "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "QA_DRIVER=$RUNNER_TEMP/qa/node_modules/puppeteer-core" >> "$GITHUB_ENV"
      - name: Test navigation, filters, search and visual layout
        env:
          TARGET: https://sexy-shop.duckdns.org
        run: |
          set -euo pipefail
          mkdir -p qa
          cat > "$RUNNER_TEMP/qa/test.cjs" <<'JS'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const pup = require(process.env.QA_DRIVER);
          (async () => {
            const browser=await pup.launch({executablePath:process.env.CHROME_BIN,headless:true,args:["--no-sandbox","--disable-dev-shm-usage"]});
            const report={target:process.env.TARGET,pages:[],checks:[],consoleErrors:[],pageErrors:[]};
            try {
              const page=await browser.newPage();
              await page.setCacheEnabled(false);
              page.on("pageerror",e=>report.pageErrors.push(e.message));
              const widths=[{name:"mobile",width:390,height:844,isMobile:true},{name:"desktop",width:1366,height:900,isMobile:false}];
              for(const view of widths){
                await page.setViewport({width:view.width,height:view.height,isMobile:view.isMobile,deviceScaleFactor:1});
                const resp=await page.goto(process.env.TARGET+"/",{waitUntil:"networkidle2",timeout:30000});
                assert.ok([200,304].includes(resp.status()),"GET / "+view.name+" status="+resp.status());
                await page.screenshot({path:"qa/home-"+view.name+".png",fullPage:true});
                const state=await page.evaluate(()=>({width:document.documentElement.scrollWidth,inner:innerWidth,title:document.title,meta:document.querySelector('meta[name="robots"]')?.content||"",brand:document.body.innerText.toLocaleLowerCase("pt-PT").includes("sevelora")}));
                assert.ok(state.brand,"brand not shown");
                assert.ok(state.width<=state.inner+1,"horizontal overflow "+view.name+" "+JSON.stringify(state));
                assert.ok(/noindex/i.test(state.meta),"staging must be noindex");
                report.pages.push({path:"/",view:view.name,http:resp.status(),...state});
                const homepageSections=await page.evaluate(()=>({
                  removed:document.querySelectorAll(".retail-showcase,.retail-trust,.retail-hero-notes").length,
                  next:document.querySelector(".retail-hero")?.nextElementSibling?.id,
                  buttons:[...document.querySelectorAll(".retail-actions a")].map(el=>el.textContent.trim()),
                  categories:document.querySelectorAll("#categorias .retail-photo-card").length,
                  featured:document.querySelectorAll(".retail-featured .real-product-card").length
                }));
                assert.equal(homepageSections.removed,0,"crossed-out module not fully removed: "+view.name);
                assert.equal(homepageSections.next,"categorias","homepage gap left after removing marked block: "+view.name);
                assert.deepEqual(homepageSections.buttons,["EXPLORAR SEX SHOP ↗","ESCOLHER CATEGORIA ↓"],"hero action buttons changed: "+view.name);
                assert.equal(homepageSections.categories,10,"real category cards changed: "+view.name);
                assert.ok(homepageSections.featured>0,"other featured products section was removed: "+view.name);
                report.checks.push("crossed-out section removed, other hero and category content preserved "+view.name+": PASS");
                console.log("CROSSED_OUT_SECTION_"+view.name.toUpperCase()+"=PASS");
                console.log("LIVE_HOMEPAGE_"+view.name.toUpperCase()+"=PASS");
                if(view.name==="mobile"){
                  await page.click(".mobile-menu summary");
                  const visible=await page.$eval(".mobile-menu nav",e=>getComputedStyle(e).display!=="none" && e.getBoundingClientRect().width>0);
                  assert.ok(visible,"mobile menu did not open");
                  report.checks.push("mobile navigation: PASS");
                  await page.$eval("#categorias",e=>e.scrollIntoView({block:"start"}));
                  await new Promise(r=>setTimeout(r,400));
                  const cards=await page.$$eval(".retail-photo-card",els=>els.map(el=>({text:el.querySelector("h3")?.textContent?.trim(),image:el.querySelector("img")?.getAttribute("src"),fit:el.querySelector("img")?getComputedStyle(el.querySelector("img")).objectFit:null})));
                  assert.equal(cards.length,10,"expected ten available disjoint product categories");
                  assert.ok(cards.every(c=>c.image&&c.fit==="contain"),"category cover must use a real, uncropped supplier image");
                  assert.equal(new Set(cards.map(c=>c.image)).size,cards.length,"category cards must have distinct, curated cover photos");
                  assert.equal(await page.$$eval(".retail-audience-card,.retail-audiences",els=>els.length),0,"removed promotional selection module is still rendered");
                  assert.equal(await page.$$eval('a[href^="/categoria/para-"]',els=>els.length),0,"removed audience options remain in mobile menu, header or footer");
                  const mobileCols=await page.$eval(".retail-category-gallery",el=>getComputedStyle(el).gridTemplateColumns.split(/\s+/).length);
                  assert.equal(mobileCols,2,"category cards should align in two mobile columns");
                  const mobileRows=await page.$$eval(".retail-photo-card",els=>els.map(el=>({top:Math.round(el.getBoundingClientRect().top),height:Math.round(el.getBoundingClientRect().height)})));
                  for(let i=0;i<mobileRows.length;i+=2){
                    assert.equal(mobileRows[i].top,mobileRows[i+1].top,"mobile category row is misaligned");
                    assert.equal(mobileRows[i].height,mobileRows[i+1].height,"mobile category cards have unequal heights");
                  }
                  report.checks.push("removed module, no audience links and aligned mobile category rows: PASS");
                  const panelBg=await page.$eval(".retail-photo-panel",el=>getComputedStyle(el).backgroundColor);
                  assert.equal(panelBg,"rgb(255, 255, 255)","real supplier photo backgrounds must blend into white cards");
                  await page.screenshot({path:"qa/categories-mobile.png",fullPage:false});
                  report.checks.push("uncropped category covers: PASS");
                }
              }
              await page.setViewport({width:390,height:844,isMobile:true,deviceScaleFactor:1});
              let resp=await page.goto(process.env.TARGET+"/catalogo",{waitUntil:"networkidle2"});
              assert.equal(resp.status(),200);
              const total=await page.$eval(".filter-sidebar button:first-of-type span",e=>Number(e.textContent.trim()));
              assert.ok(total>0,"public catalog is empty");
              assert.ok(total>=140&&total<=151,"catalog supplier count out of safe range: "+total);
              const emptyLingerieLinks=await page.$$eval('nav.category-strip a[href="/categoria/lingerie"]',nodes=>nodes.length);
              assert.equal(emptyLingerieLinks,0,"empty lingerie category must be hidden from navigation");
              report.checks.push("Portuguese curated supplier catalog and empty categories hidden: PASS");
              const catOptions=await page.$$eval('select[aria-label="Filtrar por categoria"] optgroup[label="Por tipo de produto"] option',els=>els.map(e=>e.value));
              assert.equal(catOptions.length,10,"ten exclusive product categories expected");
              let categoryTotal=0;
              for(const cat of catOptions){
                await page.select('select[aria-label="Filtrar por categoria"]',cat);
                await new Promise(r=>setTimeout(r,95));
                categoryTotal+=Number((await page.$eval('.results-label',el=>el.textContent)).match(/^\d+/)?.[0]||0);
              }
              assert.equal(categoryTotal,total,"all products must be counted once across real type categories");
              await page.select('select[aria-label="Filtrar por categoria"]',"todos");
              report.checks.push("ten disjoint product categories sum to actual supplier count: PASS");
              const shownPrice=await page.$eval("article.real-product-card .product-price",e=>e.textContent.trim());
              assert.match(shownPrice,/\d+[,.]\d{2}\s*€/,"catalog must show verified EUR prices");
              report.checks.push("catalog EUR prices visible: PASS");
              assert.equal(await page.$$eval('select[aria-label="Filtrar por categoria"] option[value^="para-"]',els=>els.length),0,"obsolete audience categories still in catalog filters");
              report.checks.push("catalog filters contain only real product types: PASS");
              await page.screenshot({path:"qa/catalogo-mobile.png",fullPage:true});
              const mobileState=await page.evaluate(()=>({documentWidth:document.documentElement.scrollWidth,viewport:innerWidth}));
              assert.ok(mobileState.documentWidth<=mobileState.viewport+1,"catalog mobile overflow");
              const searchSelector='input[aria-label="Pesquisar produtos"]';
              await page.goto(process.env.TARGET+"/",{waitUntil:"networkidle2"});
              const homePrice=await page.$eval(".retail-featured .real-product-card .product-price",e=>e.textContent.trim());
              assert.match(homePrice,/\d+[,.]\d{2}\s*€/,"homepage must show verified EUR price");
              report.checks.push("home EUR prices visible: PASS");
              await page.goto(process.env.TARGET+"/catalogo",{waitUntil:"networkidle2"});
              const firstName=await page.$eval("article.real-product-card h3",e=>e.textContent.trim());
              assert.ok(firstName.length>=5&&!/\b(?:Juguete|Disfruta|Lubricante|Satisfacción)\b/i.test(firstName),"product title must remain in Portuguese");
              report.checks.push("Portuguese product titles: PASS");
              const keyword=firstName.split(/\s+/)[0];
              assert.ok(keyword&&keyword.length>=2,"missing real product name");
              await page.type(searchSelector,keyword);
              await new Promise(r=>setTimeout(r,450));
              let count=await page.$$eval("article.real-product-card",nodes=>nodes.length);
              assert.ok(count>0,"catalog search gave no results for first real product");
              const urls=await page.$$eval('a[rel~="sponsored"]',links=>links.map(a=>a.href));
              assert.ok(urls.some(url=>{const u=new URL(url);return u.hostname==="www.awin1.com"&&u.pathname==="/pclick.php"&&u.searchParams.get("a")==="3157353"&&u.searchParams.get("m")==="37722"}),"approved Awin affiliate links missing");
              const availableProductPath=await page.$eval('article.real-product-card a[rel~="sponsored"]',el=>el.closest("article")?.querySelector("h3 a")?.getAttribute("href")||"");
              assert.ok(availableProductPath.startsWith("/produto/"),"catalog must link to available product detail");
              report.checks.push("search and approved Awin links: PASS");
              await page.click(searchSelector,{clickCount:3});
              await page.keyboard.press("Backspace");
              const categoryValues=await page.$eval('select[aria-label="Filtrar por categoria"]',e=>Array.from(e.options).map(x=>x.value).filter(v=>v!=="todos"));
              assert.ok(categoryValues.length>0,"no available categories");
              await page.select('select[aria-label="Filtrar por categoria"]',categoryValues[0]);
              await new Promise(r=>setTimeout(r,300));
              count=await page.$$eval("article.real-product-card",nodes=>nodes.length);
              assert.ok(count>0,"category filter yielded no products");
              report.checks.push("mobile category filter: PASS");
              await page.select('select[aria-label="Filtrar por categoria"]',"anal");
              await new Promise(r=>setTimeout(r,240));
              const plugs=await page.$eval('select[aria-label="Filtrar por tipo"]',el=>Array.from(el.options).some(x=>x.value==="plugs"));
              assert.ok(plugs,"anal category missing exact plugs subcategory");
              await page.select('select[aria-label="Filtrar por tipo"]',"plugs");
              await new Promise(r=>setTimeout(r,260));
              const visiblePlugs=await page.$$eval("article.real-product-card h3",nodes=>nodes.map(x=>x.textContent.trim()));
              assert.ok(visiblePlugs.length>=7&&visiblePlugs.every(x=>/plug|baccus|taoh/i.test(x)),"anal plug filter includes unrelated products");
              report.checks.push("accurate anal subcategory filtering: PASS");
              resp=await page.goto(process.env.TARGET+"/categoria/bdsm",{waitUntil:"networkidle2"});
              assert.equal(resp.status(),200);
              const bdsm=await page.$$eval("article.real-product-card h3",nodes=>nodes.map(x=>x.textContent.trim()));
              assert.deepEqual(bdsm,["Kit BDSM Fantasy"],"BDSM must not include generic harnesses or unrelated descriptions");
              report.checks.push("BDSM classification exact: PASS");
              resp=await page.goto(process.env.TARGET+"/categoria/feromonas",{waitUntil:"networkidle2"});
              assert.equal(resp.status(),200);
              assert.ok((await page.evaluate(()=>document.body.innerText)).includes("Perfumes & Feromonas"),"perfume category missing");
              report.checks.push("feromonas category: PASS");
              resp=await page.goto(process.env.TARGET+"/categoria/casais",{waitUntil:"networkidle2"});
              assert.equal(resp.status(),200);
              assert.ok((await page.evaluate(()=>document.body.innerText)).includes("Brinquedos a Dois"));
              for(const oldSlug of ["para-ela","para-ele","para-casais"]){
                const legacy=await page.goto(process.env.TARGET+"/categoria/"+oldSlug,{waitUntil:"networkidle2"});
                assert.equal(legacy.status(),404,"legacy audience option must be removed: "+oldSlug);
              }
              report.checks.push("product category navigation and three removed legacy routes: PASS");
              resp=await page.goto(process.env.TARGET+availableProductPath,{waitUntil:"networkidle2"});
              assert.equal(resp.status(),200);
              assert.ok((await page.$$eval('a[rel~="sponsored"]',nodes=>nodes.length))>0,"product affiliate CTA missing");
              const detailPrice=await page.$eval(".product-detail .product-price",e=>e.textContent.trim());
              assert.match(detailPrice,/\d+[,.]\d{2}\s*€/,"product detail must show verified EUR price");
              report.checks.push("product EUR price visible: PASS");
              assert.equal(await page.$$eval('nav[aria-label="Seleções por destinatário"]',els=>els.length),0,"obsolete audience nav still on product detail");
              const translated=await page.$eval('.product-detail p[lang="pt-PT"]',el=>el.textContent.trim());
              assert.ok(translated.length>35,"product must have a pt-PT description");
              assert.equal(await page.$$eval('.product-detail [lang="es"]',nodes=>nodes.length),0,"Spanish description must not render");
              report.checks.push("Portuguese product detail: PASS");
              await page.screenshot({path:"qa/producto-mobile.png",fullPage:true});
              report.checks.push("supplier product and CTA: PASS");
              await page.setViewport({width:1366,height:900,isMobile:false,deviceScaleFactor:1});
              resp=await page.goto(process.env.TARGET+"/catalogo",{waitUntil:"networkidle2"});
              assert.equal(resp.status(),200);
              await page.screenshot({path:"qa/catalogo-desktop.png",fullPage:true});
              const desktopState=await page.evaluate(()=>({documentWidth:document.documentElement.scrollWidth,viewport:innerWidth}));
              assert.ok(desktopState.documentWidth<=desktopState.viewport+1,"catalog desktop overflow");
              report.checks.push("desktop catalog layout: PASS");
              resp=await page.goto(process.env.TARGET+"/",{waitUntil:"networkidle2"});
              assert.equal(resp.status(),200);
              await page.$eval("#categorias",e=>e.scrollIntoView({block:"start"}));
              await new Promise(r=>setTimeout(r,320));
              await page.screenshot({path:"qa/categories-desktop.png",fullPage:false});
              const desktopCols=await page.$eval(".retail-category-gallery",el=>getComputedStyle(el).gridTemplateColumns.split(/\s+/).length);
              assert.equal(desktopCols,5,"desktop must show five category cards per row");
              assert.equal(await page.$$eval(".retail-photo-card",els=>els.length),10,"expected ten actual product categories");
              assert.equal(await page.$$eval(".retail-audiences",els=>els.length),0,"removed home module must stay deleted");
              assert.ok(!(await page.evaluate(()=>document.body.innerText)).includes("Explora à tua maneira"),"removed heading still appears");
              const desktopRows=await page.$$eval(".retail-photo-card",els=>els.map(el=>({top:Math.round(el.getBoundingClientRect().top),height:Math.round(el.getBoundingClientRect().height)})));
              for(let i=0;i<desktopRows.length;i+=5){
                const heights=desktopRows.slice(i,i+5).map(x=>x.height);
                assert.ok(Math.max(...heights)-Math.min(...heights)<=1,"desktop category cards misaligned in row "+i);
              }
              report.checks.push("five aligned category cards per desktop row with no removed module: PASS");
              assert.equal(report.pageErrors.length,0,"page runtime errors: "+report.pageErrors.join("|"));
              console.log("LIVE_CATALOG_SEARCH=PASS");
              console.log("LIVE_CATALOG_FILTER=PASS");
              console.log("LIVE_CATEGORY_NAVIGATION=PASS");
              console.log("LIVE_NO_JS_RUNTIME_ERRORS=PASS");
            } finally {
              fs.writeFileSync("qa/report.json",JSON.stringify(report,null,2));
              await browser.close();
            }
          })().catch(e=>{console.error("LIVE_BROWSER_QA_FAILED",e);process.exit(1)});
          JS
          node "$RUNNER_TEMP/qa/test.cjs"
      - name: Preserve desktop/mobile screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sevelora-staging-browser-qa
          path: qa/
          if-no-files-found: warn
          retention-days: 7
